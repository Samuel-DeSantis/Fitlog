<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitLog</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="app-content" class="app-content"></main>

  <button id="fab-log" class="fab" aria-label="Log">
    <svg viewBox="0 0 24 24" width="24" height="24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <nav class="nav-bar">
    <button class="nav-tab" data-route="/today">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
      <span>Today</span>
    </button>
    <button class="nav-tab" data-route="/train">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 12h2M18 12h2M8 8v8M16 8v8M6 10v4M18 10v4M8 12h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
      <span>Train</span>
    </button>
    <div class="nav-spacer"></div>
    <button class="nav-tab" data-route="/progress">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 19V11M11 19V5M18 19v-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
      <span>Progress</span>
    </button>
    <button class="nav-tab" data-route="/more">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>
      <span>More</span>
    </button>
  </nav>

  <script src="js/utils.js"></script>
  <script src="js/db.js"></script>
  <script src="js/queries.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/router.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/train.js"></script>
  <script src="js/views/progress.js"></script>
  <script src="js/views/more.js"></script>
  <script src="js/quicklog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
