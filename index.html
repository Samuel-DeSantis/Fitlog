<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitLog</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main id="app-content" class="app-content"></main>

  <nav class="nav-bar">
    <button class="nav-tab" data-route="/today">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l1.6-1.6M20 12l-1.6-1.6M12 4v2.2M12 20v-2.2M6.6 6.6l1.5 1.5M17.4 6.6l-1.5 1.5"/><circle cx="12" cy="12" r="4.2"/></svg>
      <span>Today</span>
    </button>
    <button class="nav-tab" data-route="/train">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2M19 12h2M6.5 8v8M17.5 8v8M4.5 10v4M19.5 10v4M6.5 12h11"/></svg>
      <span>Train</span>
    </button>
    <button class="nav-tab" data-route="/calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Calendar</span>
    </button>
    <button class="nav-tab" data-route="/progress">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V12M11 20V4M18 20v-7"/></svg>
      <span>Progress</span>
    </button>
    <button class="nav-tab" data-route="/more">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/></svg>
      <span>More</span>
    </button>
  </nav>

  <script src="js/utils.js"></script>
  <script src="js/errors.js"></script>
  <script src="js/sessionColors.js"></script>
  <script src="js/db.js"></script>
  <script src="js/queries.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/router.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views/today.js"></script>
  <script src="js/views/train.js"></script>
  <script src="js/views/workout.js"></script>
  <script src="js/views/calendar.js"></script>
  <script src="js/views/progress.js"></script>
  <script src="js/views/more.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
